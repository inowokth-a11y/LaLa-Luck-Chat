<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ทำนายฝัน — อาจารย์ลาลา</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@600;700&family=Noto+Sans+Thai:wght@400;600&family=JetBrains+Mono:wght@500;700&display=swap');

  :root{
    --bg:#14101c; --bg2:#1c1626; --gold:#f2e6c8; --gold-dim:#a89870;
    --ink:#ece6da; --ink-dim:#a89cb0; --bubble-bot:#241c30; --bubble-user:#3a2f4a;
    --wood:#3f7a5c; --fire:#c9432b; --earth:#c99a3d; --metal:#b9ae9a; --water:#2c5a72;
  }
  *{box-sizing:border-box;}
  html,body{ margin:0; background:radial-gradient(ellipse at 50% 0%, var(--bg2), var(--bg) 75%);
    color:var(--ink); font-family:'Noto Sans Thai',sans-serif; min-height:100vh; }
  .wrap{ max-width:480px; margin:0 auto; padding:16px 14px 90px; }
  h1{ font-family:'Noto Serif Thai',serif; font-weight:700; font-size:1.15rem; text-align:center; color:var(--gold); margin:2px 0; }
  .sub{ text-align:center; color:var(--ink-dim); font-size:0.72rem; margin-bottom:14px; }

  .chat{ display:flex; flex-direction:column; gap:12px; }
  .bubble{ max-width:88%; padding:12px 14px; border-radius:14px; font-size:0.86rem; line-height:1.75; }
  .bubble.bot{ align-self:flex-start; background:var(--bubble-bot); border:1px solid rgba(242,230,200,0.15); border-bottom-left-radius:3px; }
  .bubble.user{ align-self:flex-end; background:var(--bubble-user); border-bottom-right-radius:3px; }
  .bubble h4{ font-family:'Noto Serif Thai',serif; margin:0 0 6px; color:var(--gold); font-size:0.9rem; }
  .bubble .section{ margin-top:8px; }
  .bubble .label{ color:var(--gold-dim); font-weight:600; font-size:0.78rem; }
  .element-tag{
    display:inline-flex; align-items:center; gap:4px; font-family:'JetBrains Mono',monospace;
    font-size:0.7rem; padding:2px 8px; border-radius:999px; margin:2px 4px 2px 0;
  }
  .dot{ width:7px; height:7px; border-radius:50%; display:inline-block; }
  .symbol-card{
    background:rgba(255,255,255,0.03); border-left:2px solid var(--gold-dim);
    padding:6px 10px; margin-top:6px; border-radius:2px; font-size:0.8rem;
  }
  .theme-card{
    background:rgba(242,230,200,0.05); border-left:2px solid var(--gold);
    padding:8px 10px; margin-top:8px; border-radius:2px; font-size:0.8rem; line-height:1.7;
  }
  .footnote-bubble{ font-size:0.72rem; color:var(--ink-dim); margin-top:10px; padding-top:8px; border-top:1px dashed rgba(255,255,255,0.1); }

  .input-bar{
    position:fixed; bottom:0; left:0; right:0; background:var(--bg2);
    border-top:1px solid rgba(242,230,200,0.15); padding:10px 14px calc(10px + env(safe-area-inset-bottom));
  }
  .input-row{ max-width:480px; margin:0 auto; display:flex; gap:8px; }
  .input-row select, .input-row input{
    background:rgba(255,255,255,0.05); border:1px solid rgba(242,230,200,0.2); border-radius:10px;
    color:var(--ink); font-family:'Noto Sans Thai',sans-serif; font-size:0.85rem; padding:9px 10px;
  }
  .input-row select{ flex:0 0 90px; }
  .input-row input{ flex:1; }
  .input-row button{
    flex:0 0 auto; background:linear-gradient(180deg,#33283f,#1c1626); color:var(--gold);
    border:1px solid rgba(242,230,200,0.35); border-radius:10px; padding:9px 16px; font-weight:700; cursor:pointer;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>🌙 อาจารย์ลาลา</h1>
  <div class="sub">เล่าฝันให้อาจารย์ฟังได้เลยค่ะ (ฐานข้อมูล 457 สัญลักษณ์ + 50 ธีมจิตวิทยา)</div>
  <div class="chat" id="chat">
    <div class="bubble bot">สวัสดีค่ะ ✨ เล่าสิ่งที่คุณฝันเห็นเมื่อคืนมาได้เลยนะคะ อาจารย์ลาลาจะช่วยถอดรหัสให้ค่ะ</div>
  </div>
</div>

<div class="input-bar">
  <div class="input-row">
    <select id="dayOfWeek">
      <option value="อาทิตย์">อา.</option>
      <option value="จันทร์" selected>จ.</option>
      <option value="อังคาร">อ.</option>
      <option value="พุธ">พ.</option>
      <option value="พฤหัสบดี">พฤ.</option>
      <option value="ศุกร์">ศ.</option>
      <option value="เสาร์">ส.</option>
    </select>
    <input type="text" id="dreamInput" placeholder="ฝันเห็นอะไรเมื่อคืน...">
    <button id="sendBtn">ส่ง</button>
  </div>
</div>

const DB = DATA.db, PSYCH = DATA.psych;

const DAY_ELEMENT = { "อังคาร":"Fire","อาทิตย์":"Fire","จันทร์":"Water","ศุกร์":"Water","พุธ":"Wood","เสาร์":"Earth","พฤหัสบดี":null };
const THAI4 = { Fire:"ไฟ", Earth:"ดิน", Wood:"ลม", Water:"น้ำ" };
const ELEMENT_COLOR = { "ไฟ":"var(--fire)","ดิน":"var(--earth)","ลม":"var(--wood)","น้ำ":"var(--water)","ไม้":"var(--wood)","ทอง":"var(--metal)" };

function variants(text){ return text.split(/[/,]/).map(s=>s.trim()).filter(Boolean); }

// ---- Safety Gate (ported from kruth_element_engine.safety_gate) ----
const CRISIS_KEYWORDS = ["อยากตาย","ฆ่าตัวตาย","ทนไม่ไหว","สิ้นหวัง","หมดหวังแล้ว","อยากหายไป","ไม่อยากมีชีวิตอยู่","ทำร้ายตัวเอง","ไม่อยากอยู่แล้ว"];
const CRISIS_RESOURCE_MESSAGE = "หากคุณกำลังรู้สึกทุกข์ใจมากๆ หรือมีความคิดทำร้ายตัวเอง อยากให้คุณลองติดต่อ <strong>สายด่วนสุขภาพจิต 1323</strong> (โทรฟรี ตลอด 24 ชม.) หรือสมาคมสะมาริตันส์แห่งประเทศไทย <strong>02-713-6791</strong> นะคะ มีคนพร้อมรับฟังคุณอยู่เสมอ 💛<br><br>อาจารย์ลาลาขอหยุดการทำนายไว้ก่อน เพราะอยากให้คุณได้รับความช่วยเหลือที่เหมาะสมกว่านี้ค่ะ";
function safetyGate(text){
  const matched = CRISIS_KEYWORDS.filter(k => text.includes(k));
  return matched.length ? { intercepted:true, matched } : null;
}

function findSymbolMatches(text){
  const matches = [];
  for(const row of DB){
    for(const v of variants(row.dream_object)){
      if(v && text.includes(v)){ matches.push(row); break; }
    }
  }
  return matches;
}
function findThemeMatches(text){
  const matches = [];
  for(const row of PSYCH){
    for(const v of variants(row.dream_theme)){
      if(v && (text.includes(v) || v.includes(text))){ matches.push(row); break; }
    }
  }
  return matches;
}

function elementTag(elTh){
  const color = ELEMENT_COLOR[elTh] || 'var(--gold-dim)';
  return `<span class="element-tag" style="border:1px solid ${color}; color:${color};"><span class="dot" style="background:${color}"></span>${elTh}</span>`;
}

function chat(){ return document.getElementById('chat'); }
function addBubble(html, cls){
  const div = document.createElement('div');
  div.className = 'bubble ' + cls;
  div.innerHTML = html;
  chat().appendChild(div);
  window.scrollTo(0, document.body.scrollHeight);
}

document.getElementById('sendBtn').addEventListener('click', () => {
  const input = document.getElementById('dreamInput');
  const text = input.value.trim();
  if(!text) return;
  addBubble(text, 'user');
  input.value = '';

  const gate = safetyGate(text);
  if(gate){
    setTimeout(() => {
      addBubble(CRISIS_RESOURCE_MESSAGE, 'bot');
    }, 300);
    return;
  }

  const dayOfWeek = document.getElementById('dayOfWeek').value;
  const symbolMatches = findSymbolMatches(text);
  const themeMatches = findThemeMatches(text);

  setTimeout(() => {
    if(!symbolMatches.length && !themeMatches.length){
      addBubble(`🌙 <strong>ยังไม่พบสัญลักษณ์นี้ในฐานข้อมูลค่ะ</strong><br>อาจารย์ลาลามีฐานข้อมูล 457 สัญลักษณ์ + 50 ธีมจิตวิทยา แต่ยังไม่ครอบคลุมทุกคำ ลองเล่าเป็นคำอื่นที่ใกล้เคียงดูนะคะ 🙏`, 'bot');
      return;
    }

    let html = `<h4>🌙 วิเคราะห์รหัสสัญลักษณ์และฝัน</h4>`;

    if(themeMatches.length){
      themeMatches.slice(0,2).forEach(t=>{
        const elConn = t.element_connection || '';
        html += `<div class="theme-card">
          <strong>ธีม: ${t.dream_theme}</strong><br>
          🗝 ${t.psychological_meaning}<br>
          <span class="label">สัญญาณจิตใต้สำนึก:</span> ${t.subconscious_trigger}<br>
          <span class="label">แนวทาง:</span> ${t.advice}<br>
          <span class="label">ธาตุที่เชื่อมโยง:</span> ${elConn}<br>
          <span class="label">เคล็ดเสริม:</span> ${t.element_remedy}
        </div>`;
      });
    }

    if(symbolMatches.length){
      html += `<div class="section"><span class="label">สัญลักษณ์ที่พบ:</span></div>`;
      symbolMatches.slice(0,4).forEach(s=>{
        html += `<div class="symbol-card">
          <strong>${s.dream_object}</strong> ${elementTag(s.element)}<br>
          <span style="color:var(--ink-dim); font-size:0.76rem;">${s.meaning_keyword}</span>
          <span style="color:var(--ink-dim); font-size:0.7rem;"> · ขีดคังซี ${s.kangxi_strokes} (${s.chinese_char})</span>
        </div>`;
      });
    }

    // Context synthesis
    const dayEl = DAY_ELEMENT[dayOfWeek];
    if(dayEl){
      const dayElTh = THAI4[dayEl];
      const allEls = symbolMatches.map(s=>s.element);
      const matchDay = allEls.includes(dayElTh);
      html += `<div class="section" style="font-size:0.82rem;">
        ⏳ <strong>ปัจจัยแวดล้อม:</strong> วันที่ฝัน (${dayOfWeek}, ธาตุ${dayElTh})
        ${matchDay ? 'ตรงกับธาตุของสัญลักษณ์ที่ฝันเห็น — พลังงานนี้กำลังเข้มข้นเป็นพิเศษ' : 'เป็นคนละธาตุกับสัญลักษณ์ที่ฝัน — อาจสื่อถึงความรู้สึกที่ขัดกับจังหวะชีวิตตอนนี้'}
      </div>`;
    }

    html += `<div class="footnote-bubble">💡 นี่คือการตีความระดับหลักการเท่านั้น ให้คุณลองพิจารณาต่อเองว่าเชื่อมกับเรื่องงาน ความรัก หรือสุขภาพ — หากต้องการให้อาจารย์ฟันธงเจาะจง พิมพ์ว่า "ขอคำทำนายลึก" ได้เลยค่ะ</div>`;

    addBubble(html, 'bot');
  }, 400);
});

document.getElementById('dreamInput').addEventListener('keypress', (e) => {
  if(e.key === 'Enter') document.getElementById('sendBtn').click();
});
</script>
